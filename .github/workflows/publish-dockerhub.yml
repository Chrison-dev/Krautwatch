name: publish-dockerhub

on:
  workflow_dispatch:
    inputs:
      ImageTag:
        description: "Image tag to publish. Defaults to the build's own tag resolution when left blank."
        required: false

jobs:
  ubuntu-latest:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    environment: dockerhub
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 'Cache: .fallout/temp, ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            .fallout/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 'Restore: dotnet tools'
        run: dotnet tool restore
      - name: 'Run: PushDockerHub'
        run: dotnet fallout PushDockerHub
        env:
          ImageTag: ${{ github.event.inputs.ImageTag }}
          RegistryUser: ${{ secrets.REGISTRY_USER }}
          RegistryPassword: ${{ secrets.REGISTRY_PASSWORD }}
